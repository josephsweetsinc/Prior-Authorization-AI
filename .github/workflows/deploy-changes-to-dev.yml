name: Deploy changes to Dev

on:
  push:
     branches:
       - main
  workflow_dispatch:
env:
  ENVIRONMENT: prod
jobs:
  code_quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run mypy
        run: uv run mypy --config-file pyproject.toml .

      - name: Run pytest
        run: uv run pytest

      - name: Run ruff (lint)
        run: uv run ruff check .

      - name: Run ruff (format check)
        run: uv run ruff format --check .

      - name: Check YAML syntax
        run: |
          find . -type f \( -name "*.yaml" -o -name "*.yml" \) -print0 | \
            xargs -0 -I {} uv run python -c "import sys, yaml; yaml.safe_load(open('{}', 'r'))"

      - name: Check for trailing whitespace
        run: |
          if grep -rIn --exclude-dir={.git,.venv,venv,__pycache__} '\s$' .; then
            echo "Trailing whitespace found"
            exit 1
          fi

      - name: Check for missing newline at end of file
        run: |
          if find . -type f -not -path "*/\.*" | xargs -I {} bash -c 'tail -c1 "{}" | od -An -t x1 | grep -qv "0a" && echo "{} missing newline"'; then
            echo "Missing newline at end of file found"
            exit 1
          fi

      - name: Check for debug statements
        run: |
          if grep -rInE '\bprint\s*\(|\bpdb\.set_trace\b' . --exclude-dir={.git,.venv,venv,__pycache__,.mypy_cache,tests,scripts,.github,terraform} 2>/dev/null; then
            echo "Debug statements found in source code"
            exit 1
          fi

  deploy-to-server:
    runs-on: ubuntu-latest
    needs: code_quality

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Get ssh key
      run: |
        echo "${{ secrets.SSH_KEY }}" > ../id_ed25519
        chmod 600 ../id_ed25519

    - name: Get repo name
      run: |
        echo "REPO_NAME=${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}" >> $GITHUB_ENV

    - name: Get ec2 instance IP
      run: |
        PUBLIC_IP=$(aws ec2 describe-instances \
          --filters "Name=tag:Name,Values=${{ env.REPO_NAME }}-${{ env.ENVIRONMENT }}" "Name=instance-state-name,Values=running" \
          --query "Reservations[0].Instances[0].PublicIpAddress" \
          --output text)

        echo "PUBLIC_IP=$PUBLIC_IP" >> $GITHUB_ENV


    - name: Deploy to the server
      run: |
        ssh -o StrictHostKeyChecking=no -i ../id_ed25519 ubuntu@${{ env.PUBLIC_IP }} << 'EOF'
        cd ~/${{ env.REPO_NAME }}
        git fetch origin
        git reset --hard origin/main
        git checkout main
        git pull
        echo "${{ secrets.ENV }}" > .env
        docker compose down
        docker system prune -af && docker builder prune --all --force
        docker compose up -d --build
        EOF
