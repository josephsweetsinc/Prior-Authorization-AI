services:
  paai_database:
    container_name: "local_paai_db"
    image: postgres:17.5-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=qwerty123
      - POSTGRES_DB=paai_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - container
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  paai_api:
    container_name: "local_paai_api"
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ../prior-authorizationai/.env
    ports:
      - "3100:8000"
    volumes:
      - .:/app
      - /app/.venv  # Exclude .venv from host mount to preserve installed packages
    networks:
      - container
    depends_on:
      paai_database:
        condition: service_healthy
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
networks:
  container:
    driver: bridge
