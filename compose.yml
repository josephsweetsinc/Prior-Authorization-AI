services:
  paai_api:
    container_name: "local_paai_api"
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    ports:
      - "3100:8000"
    volumes:
      - .:/app
      - /app/.venv # Exclude .venv from host mount to preserve installed packages
    networks:
      - container
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000 --reload

networks:
  container:
    driver: bridge
